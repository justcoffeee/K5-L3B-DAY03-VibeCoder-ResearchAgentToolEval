# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools (CP3) ----------------
  - name: analyze_text
    description: >-
      Dùng LLM (Groq) để tóm tắt, rút ý chính hoặc đánh giá sentiment của một đoạn text ĐÃ CÓ.
      DÙNG KHI agent đã lấy được nội dung (từ fetch, paper_text, timeline, social_search...) và user
      muốn "tóm tắt", "ý chính", "dư luận tích cực/tiêu cực".
      KHÔNG DÙNG để tìm kiếm hoặc đọc URL: tool không truy cập web, phải gọi fetch/lookup/timeline trước.
      KHÔNG DÙNG để trình bày nhiều item thành bản tin (dùng format).
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Nội dung nguyên văn cần phân tích, lấy từ kết quả tool trước. Không truyền URL."
        task:
          type: string
          enum: [summary, key_points, sentiment]
          default: summary
          description: "summary khi user muốn tóm tắt; key_points khi muốn các ý chính/gạch đầu dòng; sentiment khi hỏi thái độ/dư luận tích cực hay tiêu cực."
        focus:
          type: string
          default: ""
          description: "Khía cạnh user muốn tập trung nếu có (vd: 'chi phí', 'rủi ro'). Để trống nếu không nói."
        language:
          type: string
          default: vi
          description: "Ngôn ngữ của output: vi (mặc định) hoặc en nếu user yêu cầu tiếng Anh."
        max_words:
          type: integer
          default: 150
          description: "Độ dài tối đa của summary (30-500 từ). Đặt theo yêu cầu của user, ví dụ 'tóm tắt trong 50 chữ' thì 50."
      required: [text]

  - name: rank
    description: >-
      Lọc trùng và xếp hạng các item ĐÃ THU THẬP từ tool khác (lookup, social_search, timeline, papers...),
      giữ lại top_k. Chạy cục bộ, không gọi mạng.
      DÙNG KHI có nhiều item (gộp từ nhiều nguồn hoặc nhiều hơn số user cần) và user muốn
      "top N quan trọng nhất", "mới nhất trước", "nhiều tương tác nhất". Gọi TRƯỚC format.
      KHÔNG DÙNG khi chưa có item (phải tìm trước), khi chỉ có 1-2 item, để tóm tắt nội dung (dùng analyze_text)
      hoặc chỉ để trình bày (dùng format).
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Truyền nguyên các item lấy từ kết quả tool trước (giữ title, url, source, summary, date, metrics, score...)."
          items: {type: object}
        query:
          type: string
          default: ""
          description: "Chủ đề hoặc câu hỏi của user, dùng để chấm độ liên quan (vd: 'GPT-5')."
        criteria:
          type: string
          enum: [balanced, relevance, recency, popularity]
          default: balanced
          description: "recency khi user muốn 'mới nhất'; popularity khi muốn 'nổi bật/nhiều like/viral'; relevance khi muốn 'liên quan nhất'; còn lại balanced."
        top_k:
          type: integer
          default: 5
          description: "Số item giữ lại (1-20), lấy đúng số user yêu cầu, mặc định 5."
      required: [items]
