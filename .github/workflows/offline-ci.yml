name: Offline CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: starter_v0/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r starter_v0/requirements.txt
      - name: Run the test suite with network access blocked
        working-directory: starter_v0
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python - <<'PY'
          import os
          import socket
          import sys

          for name in list(os.environ):
              if name.endswith('_API_KEY') or name.startswith('TELEGRAM_') or name == 'DAY03_ENV_FILE':
                  os.environ.pop(name, None)

          class NetworkBlocked(BaseException):
              pass

          def deny_network(*args, **kwargs):
              raise NetworkBlocked('Live network access is forbidden in offline CI; mock the request.')

          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network
          socket.create_connection = deny_network
          socket.getaddrinfo = deny_network

          import pytest
          sys.exit(pytest.main(['-q', '-ra', '-p', 'no:cacheprovider', 'tests']))
          PY
